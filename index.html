<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>自動水やり</title>
  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2a4a 0%, #1a5276 50%, #0f2a4a 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      justify-content: flex-start; color: white; padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(20px);
      border-radius: 28px; padding: 28px 24px;
      width: 100%; max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15); margin-bottom: 16px;
    }
    .header { text-align: center; margin-bottom: 20px; }
    .icon   { font-size: 48px; display: block; margin-bottom: 6px; }
    h1 { font-size: 20px; font-weight: 700; }
    h2 { font-size: 12px; font-weight: 400; opacity: 0.6; margin-top: 3px; }

    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.25); border-radius: 12px;
      padding: 10px 16px; margin-bottom: 20px; font-size: 13px;
    }
    .dot { width:10px; height:10px; border-radius:50%; background:#888; flex-shrink:0; transition:background 0.3s; }
    .dot.connected    { background:#4ade80; box-shadow:0 0 8px #4ade80; }
    .dot.connecting   { background:#fbbf24; animation:pulse 1s infinite; }
    .dot.disconnected { background:#f87171; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .pump-section { text-align: center; margin-bottom: 20px; }
    .pump-status  { font-size: 14px; opacity: 0.75; margin-bottom: 14px; }
    .pump-btn {
      width:148px; height:148px; border-radius:50%; border:none;
      cursor:pointer; color:white;
      transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
      outline:none; -webkit-tap-highlight-color:transparent;
    }
    .pump-btn.off { background:radial-gradient(circle at 40% 35%, #5b9bd5, #1a5276); box-shadow:0 6px 30px rgba(26,82,118,0.6), inset 0 1px 0 rgba(255,255,255,0.3); }
    .pump-btn.on  { background:radial-gradient(circle at 40% 35%, #60efff, #0891b2); box-shadow:0 6px 40px rgba(8,145,178,0.8), inset 0 1px 0 rgba(255,255,255,0.3); animation:glow 1.5s ease-in-out infinite alternate; }
    .pump-btn:active   { transform:scale(0.94); }
    .pump-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    @keyframes glow {
      from { box-shadow:0 6px 30px rgba(8,145,178,0.6); }
      to   { box-shadow:0 6px 50px rgba(8,145,178,0.95), 0 0 60px rgba(96,239,255,0.35); }
    }
    .btn-icon  { font-size:38px; display:block; margin-bottom:4px; }
    .btn-label { font-size:15px; letter-spacing:1px; font-weight:700; }
    .btn-timer { font-size:13px; margin-top:3px; opacity:0.9; }

    .section-title { font-size:11px; opacity:0.5; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:10px; }

    .dur-row { display:flex; align-items:center; justify-content:center; gap:8px; }
    .dur-row.spaced { margin-bottom:0; }
    .time-input-group { display:flex; align-items:center; gap:4px; }
    .time-input-group label { font-size:12px; opacity:0.6; }
    .num-input {
      width:52px; background:rgba(0,0,0,0.3);
      border:1px solid rgba(255,255,255,0.2); border-radius:10px;
      color:white; font-size:20px; font-weight:700; text-align:center;
      padding:6px 4px; outline:none; -webkit-appearance:none;
    }
    .num-input.sm { width:44px; font-size:16px; padding:5px 2px; }
    .num-input:focus { border-color:rgba(96,239,255,0.6); }
    .timer-sep    { font-size:22px; font-weight:700; opacity:0.5; }
    .timer-sep.sm { font-size:16px; }

    /* スケジュール */
    .schedule-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
    .schedule-item {
      display:flex; align-items:center; justify-content:space-between;
      background:rgba(0,0,0,0.2); border-radius:12px; padding:10px 14px;
    }
    .schedule-item .s-time { font-weight:700; font-size:16px; }
    .schedule-item .s-dur  { opacity:0.6; font-size:12px; margin-top:2px; }
    .schedule-item .s-left { display:flex; flex-direction:column; }
    .schedule-toggle { background:none; border:none; cursor:pointer; font-size:20px; padding:4px; transition:transform 0.2s; }
    .schedule-toggle:hover { transform:scale(1.2); }
    .del-btn { background:none; border:none; cursor:pointer; color:#f87171; font-size:18px; padding:4px 6px; }

    .add-form { background:rgba(0,0,0,0.15); border-radius:14px; padding:14px; }
    .add-form-row1 { display:flex; gap:12px; align-items:flex-end; margin-bottom:10px; }
    .add-form-label { font-size:11px; opacity:0.5; letter-spacing:1px; margin-bottom:6px; }
    .time-picker {
      background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2);
      border-radius:10px; color:white; font-size:16px; font-weight:700;
      padding:7px 10px; outline:none; width:110px;
    }
    .time-picker:focus { border-color:rgba(96,239,255,0.6); }
    .add-btn {
      background:rgba(96,239,255,0.2); border:1px solid rgba(96,239,255,0.4);
      border-radius:10px; color:white; font-size:13px; font-weight:600;
      padding:8px 16px; cursor:pointer; white-space:nowrap; width:100%;
    }
    .add-btn:hover { background:rgba(96,239,255,0.35); }

    /* 履歴 */
    .history-title { font-size:11px; opacity:0.5; margin-bottom:10px; text-transform:uppercase; letter-spacing:1.5px; }
    .history-list  { list-style:none; display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto; }
    .history-item  { background:rgba(0,0,0,0.2); border-radius:10px; padding:9px 14px; font-size:13px; display:flex; justify-content:space-between; align-items:center; }
    .history-item .time   { opacity:0.6; }
    .history-item .action-on  { color:#60efff; font-weight:600; }
    .history-item .action-off { color:#86efac; font-weight:600; }
    .h-badge { font-size:10px; opacity:0.5; margin-left:4px; }
    .no-history { text-align:center; opacity:0.35; font-size:13px; padding:12px; }
  </style>
</head>
<body>

  <!-- メインカード -->
  <div class="card">
    <div class="header">
      <span class="icon">💧</span>
      <h1>自動水やり</h1>
      <h2>Auto Watering System</h2>
    </div>

    <div class="status-bar">
      <div class="dot connecting" id="dot"></div>
      <span id="status-text">接続中...</span>
    </div>

    <div class="pump-section">
      <p class="pump-status" id="pump-status">ポンプ状態: 取得中...</p>
      <button class="pump-btn off" id="pump-btn" onclick="togglePump()" disabled>
        <span class="btn-icon">🚿</span>
        <span class="btn-label" id="btn-label">タップ</span>
        <span class="btn-timer" id="btn-timer"></span>
      </button>
    </div>

    <p class="section-title">手動起動時間</p>
    <div class="dur-row spaced">
      <div class="time-input-group">
        <input class="num-input" type="number" id="dur-min" min="0" max="59" value="0">
        <label>分</label>
      </div>
      <span class="timer-sep">:</span>
      <div class="time-input-group">
        <input class="num-input" type="number" id="dur-sec" min="0" max="59" value="30">
        <label>秒</label>
      </div>
    </div>
  </div>

  <!-- スケジュールカード -->
  <div class="card">
    <p class="section-title">スケジュール実行</p>
    <div class="schedule-list" id="schedule-list"></div>
    <div class="add-form">
      <div class="add-form-row1">
        <div>
          <p class="add-form-label">実行時刻</p>
          <input class="time-picker" type="time" id="schedule-time" value="07:00" oninput="saveAddForm()">
        </div>
        <div>
          <p class="add-form-label">起動時間</p>
          <div class="dur-row">
            <div class="time-input-group">
              <input class="num-input sm" type="number" id="s-dur-min" min="0" max="59" value="0" oninput="saveAddForm()">
              <label>分</label>
            </div>
            <span class="timer-sep sm">:</span>
            <div class="time-input-group">
              <input class="num-input sm" type="number" id="s-dur-sec" min="0" max="59" value="30" oninput="saveAddForm()">
              <label>秒</label>
            </div>
          </div>
        </div>
      </div>
      <button class="add-btn" onclick="addSchedule()">＋ スケジュール追加</button>
    </div>
  </div>

  <!-- 履歴カード -->
  <div class="card">
    <p class="history-title">操作履歴</p>
    <ul class="history-list" id="history-list">
      <li class="no-history">まだ操作がありません</li>
    </ul>
  </div>

  <script>
    const BROKER         = 'wss://7c11a17ad37643f7a3572dccfdfae248.s1.eu.hivemq.cloud:8884/mqtt';
    const USERNAME       = 'YutoK';
    const PASSWORD       = 'Yut0ichigeki';
    const TOPIC_CONTROL  = 'tomato/pump/control';
    const TOPIC_STATUS   = 'tomato/pump/status';
    const TOPIC_SCHEDULE = 'tomato/pump/schedule';
    const TOPIC_EVENTLOG = 'tomato/pump/eventlog';

    const HISTORY_KEY   = 'watering_history';
    const SCHEDULE_KEY  = 'watering_schedules';
    const TIMER_KEY     = 'watering_active_timer';
    const LAST_TS_KEY   = 'watering_last_status_ts';
    const MAX_HISTORY   = 50;

    let isPumpOn        = false;
    let mqttClient;
    let isInitialStatus = true;
    let pendingCmd      = null;
    let countdownTimer  = null;

    const dot         = document.getElementById('dot');
    const statusText  = document.getElementById('status-text');
    const pumpStatus  = document.getElementById('pump-status');
    const pumpBtn     = document.getElementById('pump-btn');
    const btnLabel    = document.getElementById('btn-label');
    const btnTimer    = document.getElementById('btn-timer');
    const historyList = document.getElementById('history-list');

    /* ── 接続状態 ── */
    function setConnectionStatus(state) {
      dot.className = 'dot ' + state;
      statusText.textContent = { connected:'接続済み', connecting:'接続中...', disconnected:'切断されました' }[state];
    }

    /* ── ポンプUI ── */
    function updatePumpUI(on) {
      isPumpOn = on;
      pumpBtn.className = 'pump-btn ' + (on ? 'on' : 'off');
      btnLabel.textContent = on ? 'ON' : 'OFF';
      pumpStatus.textContent = 'ポンプ状態: ' + (on ? '動作中 💧' : '停止中');
      if (!on) stopCountdownDisplay();
    }

    /* ── カウントダウン表示（表示のみ。実際のOFFはESP32が担当） ── */
    function startCountdownDisplay(totalSec) {
      stopCountdownDisplay();
      let remaining = totalSec;
      renderCountdown(remaining);
      countdownTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          stopCountdownDisplay();
        } else {
          renderCountdown(remaining);
        }
      }, 1000);
    }

    function stopCountdownDisplay() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      btnTimer.textContent = '';
      localStorage.removeItem(TIMER_KEY);
    }

    function renderCountdown(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      btnTimer.textContent = `残り ${m}:${String(s).padStart(2,'0')}`;
    }

    // ページを再度開いたとき、タイマーの残り時間を復元
    function restoreCountdownIfActive() {
      const stored = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null');
      if (!stored) return;
      const elapsed   = Math.floor((Date.now() - stored.startMs) / 1000);
      const remaining = stored.durationSec - elapsed;
      if (remaining > 0 && isPumpOn) {
        startCountdownDisplay(remaining);
      } else {
        localStorage.removeItem(TIMER_KEY);
      }
    }

    /* ── MQTT送信 ── */
    function sendCommand(cmd) {
      if (!mqttClient || !mqttClient.connected) return;
      mqttClient.publish(TOPIC_CONTROL, cmd);
    }

    /* ── 手動トグル ── */
    function togglePump() {
      const cmd = isPumpOn ? 'OFF' : 'ON';

      // 即時UIを更新
      updatePumpUI(cmd === 'ON');

      if (cmd === 'ON') {
        const min   = parseInt(document.getElementById('dur-min').value || 0);
        const sec   = parseInt(document.getElementById('dur-sec').value || 0);
        const total = min * 60 + sec;
        if (total > 0) {
          startCountdownDisplay(total);
          // ページを離れても残り時間を復元できるよう保存
          localStorage.setItem(TIMER_KEY, JSON.stringify({ startMs: Date.now(), durationSec: total }));
          // ESP32にON+秒数を送る（ESP32がタイマーを持つ）
          pendingCmd = 'ON';
          sendCommand('ON:' + total);
        } else {
          pendingCmd = 'ON';
          sendCommand('ON');
        }
        addHistory('ON');
      } else {
        stopCountdownDisplay();
        pendingCmd = 'OFF';
        sendCommand('OFF');
        addHistory('OFF');
      }
    }

    /* ── 履歴 ── */
    function loadHistory() {
      const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      if (!saved.length) return;
      historyList.querySelector('.no-history')?.remove();
      saved.forEach(item => historyList.appendChild(makeHistoryEl(item)));
    }

    function makeHistoryEl({ time, action, auto, timer }) {
      const li = document.createElement('li');
      li.className = 'history-item';
      const badge = auto  ? '<span class="h-badge">自動</span>'
                  : timer ? '<span class="h-badge">タイマー</span>'
                  : '';
      li.innerHTML = `<span class="time">${time}</span>
        <span class="action-${action.toLowerCase()}">${action==='ON'?'▶ 開始':'■ 停止'}${badge}</span>`;
      return li;
    }

    function addHistory(action, auto = false, timer = false, epochSec = 0) {
      const d    = epochSec > 0 ? new Date(epochSec * 1000) : new Date();
      const time = d.toLocaleDateString('ja-JP', { month:'2-digit', day:'2-digit' })
                 + ' ' + d.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      historyList.querySelector('.no-history')?.remove();
      historyList.insertBefore(makeHistoryEl({ time, action, auto, timer }), historyList.firstChild);

      const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      saved.unshift({ time, action, auto, timer });
      if (saved.length > MAX_HISTORY) saved.length = MAX_HISTORY;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(saved));

      while (historyList.children.length > MAX_HISTORY) historyList.removeChild(historyList.lastChild);
    }

    /* ── スケジュール ──
       スケジュールはWebアプリのlocalStorage + MQTTブローカー(retain)で管理。
       ESP32がMQTTブローカーからスケジュールを受け取り、実際の実行はESP32が担当。
    ── */
    let schedules = JSON.parse(localStorage.getItem(SCHEDULE_KEY) || '[]');

    // スケジュール → MQTT publish（ESP32とブローカーに保存）
    function publishSchedules() {
      if (!mqttClient || !mqttClient.connected) return;
      // フォーマット: "HH:MM:秒数:有効|..."
      const str = schedules
        .map(s => `${s.time}:${s.min * 60 + s.sec}:${s.enabled ? 1 : 0}`)
        .join('|');
      mqttClient.publish(TOPIC_SCHEDULE, str, { retain: true });
      localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules));
    }

    function saveSchedulesLocal() {
      localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules));
    }

    function renderSchedules() {
      const list = document.getElementById('schedule-list');
      list.innerHTML = '';
      if (!schedules.length) {
        list.innerHTML = '<p style="opacity:0.35;font-size:13px;text-align:center;padding:8px 0 10px">スケジュールなし</p>';
        return;
      }
      schedules.forEach((s, i) => {
        const durLabel = s.min > 0 ? `${s.min}分${s.sec}秒` : `${s.sec}秒`;
        const div = document.createElement('div');
        div.className = 'schedule-item';
        div.innerHTML = `
          <div class="s-left">
            <span class="s-time">${s.time}</span>
            <span class="s-dur">${durLabel} 起動</span>
          </div>
          <div style="display:flex;align-items:center;gap:4px">
            <button class="schedule-toggle" onclick="toggleSchedule(${i})">${s.enabled ? '✅' : '⬜'}</button>
            <button class="del-btn" onclick="deleteSchedule(${i})">🗑</button>
          </div>`;
        list.appendChild(div);
      });
    }

    const ADD_FORM_KEY = 'watering_add_form';

    function saveAddForm() {
      const t   = document.getElementById('schedule-time').value;
      const min = document.getElementById('s-dur-min').value;
      const sec = document.getElementById('s-dur-sec').value;
      localStorage.setItem(ADD_FORM_KEY, JSON.stringify({ t, min, sec }));
    }

    function restoreAddForm() {
      const saved = JSON.parse(localStorage.getItem(ADD_FORM_KEY) || 'null');
      if (!saved) return;
      if (saved.t)   document.getElementById('schedule-time').value = saved.t;
      if (saved.min !== undefined) document.getElementById('s-dur-min').value = saved.min;
      if (saved.sec !== undefined) document.getElementById('s-dur-sec').value = saved.sec;
    }

    function addSchedule() {
      const t   = document.getElementById('schedule-time').value;
      const min = parseInt(document.getElementById('s-dur-min').value || 0);
      const sec = parseInt(document.getElementById('s-dur-sec').value || 0);
      if (!t) return;
      if (min === 0 && sec === 0) { alert('起動時間を設定してください'); return; }
      schedules.push({ time: t, min, sec, enabled: true });
      schedules.sort((a, b) => a.time.localeCompare(b.time));
      renderSchedules();
      publishSchedules();
    }

    function deleteSchedule(i) {
      schedules.splice(i, 1);
      renderSchedules();
      publishSchedules();
    }

    function toggleSchedule(i) {
      schedules[i].enabled = !schedules[i].enabled;
      renderSchedules();
      publishSchedules();
    }

    /* ── MQTTスケジュール文字列 → ローカル形式に変換 ──
       ESP32/Webから送られる "HH:MM:totalSec:enabled|..." を {time, min, sec, enabled} に変換。
       ローカルのschedules配列が空のときだけ使い、ブローカーのretainedから復元する。
    ── */
    function restoreSchedulesFromMQTT(raw) {
      if (!raw) return [];
      return raw.split('|').map(entry => {
        const parts = entry.split(':');
        if (parts.length < 4) return null;
        const time     = `${parts[0]}:${parts[1]}`;
        const totalSec = parseInt(parts[2]) || 0;
        const enabled  = parts[3] === '1';
        return { time, min: Math.floor(totalSec / 60), sec: totalSec % 60, enabled };
      }).filter(Boolean);
    }

    /* ── イベントログ処理 ──
       ESP32が"ON:schedule:1722553200|OFF:timer:1722553230|..."形式でpublish。
       lastTs以降の自動イベント（timer/schedule）のみ履歴に追加。
       manual操作はtogglePump()で既に追加済みなのでスキップ。
    ── */
    function processEventLog(raw) {
      if (!raw) return;
      const lastTs = parseInt(localStorage.getItem(LAST_TS_KEY) || '0');
      let newLastTs = lastTs;
      const entries = raw.split('|');

      entries.forEach(entry => {
        const parts = entry.split(':');
        if (parts.length < 3) return;
        const s  = parts[0];           // "ON" or "OFF"
        const r  = parts[1];           // "schedule" / "timer" / "manual"
        const ts = parseInt(parts[2]) || 0;

        if (ts <= lastTs) return;      // 既に処理済み
        if (r === 'manual') return;    // 手動操作はtogglePump()で追加済み

        if (s === 'ON') {
          addHistory('ON', true, false, ts);
        } else {
          addHistory('OFF', false, r === 'timer', ts);
        }

        if (ts > newLastTs) newLastTs = ts;
      });

      if (newLastTs > lastTs) {
        localStorage.setItem(LAST_TS_KEY, String(newLastTs));
      }
    }

    /* ── ステータスメッセージのパース ──
       形式: "ON:schedule:1722553200" / "OFF:timer:1722553200" / "ON" (旧形式)
    ── */
    function parseStatus(raw) {
      const parts = raw.split(':');
      if (parts.length >= 3) {
        return { s: parts[0], r: parts[1], ts: parseInt(parts[2]) || 0 };
      }
      return { s: raw, r: 'manual', ts: 0 };
    }

    /* ── MQTT接続 ── */
    function connect() {
      setConnectionStatus('connecting');
      mqttClient = mqtt.connect(BROKER, {
        username: USERNAME,
        password: PASSWORD,
        clientId: 'WebApp-' + Math.random().toString(16).slice(2, 8),
        reconnectPeriod: 3000,
        connectTimeout: 10000,
      });

      mqttClient.on('connect', () => {
        setConnectionStatus('connected');
        pumpBtn.disabled = false;
        isInitialStatus = true;
        mqttClient.subscribe(TOPIC_STATUS);
        mqttClient.subscribe(TOPIC_EVENTLOG);
        mqttClient.subscribe(TOPIC_SCHEDULE);  // retained からスケジュールを復元
        // schedules が空でない場合のみ publish（空を publish するとESP32のスケジュールが消えるのを防ぐ）
        if (schedules.length > 0) {
          setTimeout(() => publishSchedules(), 500);
        }
      });

      mqttClient.on('message', (topic, payload) => {
        const raw = payload.toString();

        // ── イベントログ処理（不在中の全イベントを履歴に反映） ──
        if (topic === TOPIC_EVENTLOG) {
          processEventLog(raw);
          return;
        }

        // ── スケジュール復元（ローカルが空のときブローカーの retained から復元） ──
        if (topic === TOPIC_SCHEDULE) {
          if (schedules.length === 0 && raw.length > 0) {
            const restored = restoreSchedulesFromMQTT(raw);
            if (restored.length > 0) {
              schedules = restored;
              renderSchedules();
              saveSchedulesLocal();
            }
          }
          return;
        }

        if (topic !== TOPIC_STATUS) return;
        const { s, r, ts } = parseStatus(raw);

        // 再接続直後のretained → UIだけ同期（履歴はeventlogで処理）
        if (isInitialStatus) {
          isInitialStatus = false;
          updatePumpUI(s === 'ON');
          if (s === 'ON') restoreCountdownIfActive();
          return;
        }

        // 自分が送ったコマンドのエコー → UI補正のみ
        if (pendingCmd === s) {
          pendingCmd = null;
          updatePumpUI(s === 'ON');
          if (ts > 0) localStorage.setItem(LAST_TS_KEY, String(ts));
          return;
        }

        // リアルタイムの外部変化（ESP32タイマー満了・スケジュール実行・別デバイス）
        const wasOn = isPumpOn;
        if (s !== (wasOn ? 'ON' : 'OFF')) {
          updatePumpUI(s === 'ON');
          if (s === 'OFF') stopCountdownDisplay();

          // timer/schedule はeventlogでも届くのでどちらか先着の方だけ記録（lastTsで重複排除）
          const lastTs2 = parseInt(localStorage.getItem(LAST_TS_KEY) || '0');
          if (r === 'manual' || (ts > 0 && ts > lastTs2)) {
            if (ts > 0) localStorage.setItem(LAST_TS_KEY, String(ts));
            if (s === 'ON') {
              addHistory('ON', r === 'schedule', false, ts);
            } else {
              addHistory('OFF', false, r === 'timer', ts);
            }
          }
        }
      });

      mqttClient.on('disconnect', () => { setConnectionStatus('disconnected'); pumpBtn.disabled = true; });
      mqttClient.on('error', err => { console.error(err); setConnectionStatus('disconnected'); });
    }

    /* ── 初期化 ── */
    loadHistory();
    renderSchedules();
    restoreAddForm();
    connect();
  </script>
</body>
</html>
